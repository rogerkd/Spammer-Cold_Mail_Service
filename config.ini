; ============================================================
;  The only settings you need to edit.
; ============================================================
[settings]


; How many emails to send per day. The script automatically picks the
; next people from data/contacts.csv who haven't been emailed yet.
; Start low (10-20) for the first week, then raise slowly.
emails_per_day = 100

; Wait between every email, in seconds. A random value between
; min and max is used each time so it looks natural.
gap_min_seconds = 120
gap_max_seconds = 150

; Maximum number of follow-ups after the initial email (1-3).
max_followup_weeks = 1

; Days before the first follow-up and the minimum gap before every later one (1-90).
; Default is 7 days.
followup_interval_days = 5
